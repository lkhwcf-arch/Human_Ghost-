name: Windows 게임 빌드
run-name: Windows ${{ inputs.build_mode == 'release' && '정식' || '테스트' }} 빌드 · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'build: 게임 빌드 / notice-test: 빌드 채널 공지만 확인'
        type: choice
        options: [build, notice-test]
        default: build
      build_mode:
        description: 'development: 테스트 빌드 / release: 정식 빌드'
        type: choice
        options: [development, release]
        default: development
      revision:
        description: '대상 커밋 전체 SHA·태그·브랜치. 비우면 실행 브랜치의 이번 실행 커밋'
        type: string
        required: false
        default: ''
      scene:
        description: 'build-settings: 타이틀부터 도화골까지 / dohwagol: 도화골 전투만 / preview: 임시 게임플레이'
        type: choice
        options: [build-settings, dohwagol, preview]
        default: build-settings

permissions:
  contents: read

concurrency:
  group: windows-game-build
  cancel-in-progress: false

jobs:
  revision:
    name: 빌드 리비전 확정
    if: inputs.operation == 'build'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      short-sha: ${{ steps.target.outputs.short-sha }}
    steps:
      - name: 지정 리비전 받기
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 실제 대상 커밋 기록
        id: target
        shell: python
        run: |
          import os
          import subprocess
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\nshort-sha={sha[:12]}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"## 빌드 대상 리비전\n- 실제 커밋: `{sha}`\n- 검사와 빌드가 같은 커밋을 사용합니다.\n")

  checks:
    name: 빌드 전 기존 검사
    needs: revision
    if: inputs.operation == 'build'
    uses: ./.github/workflows/project-checks.yml
    with:
      revision: ${{ needs.revision.outputs.sha }}

  build:
    name: Windows 빌드와 결과물 보관
    needs: [revision, checks]
    if: inputs.operation == 'build' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - name: 빌드 대상 코드 받기
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - name: Unity 인증 정보 등록 여부 확인
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: python
        run: |
          import os
          import sys
          missing = [name for name in ("UNITY_EMAIL", "UNITY_PASSWORD", "UNITY_LICENSE") if not os.environ.get(name, "").strip()]
          if missing:
              sys.exit("필요한 GitHub 비밀값이 없습니다: " + ", ".join(missing))
          print("인증 정보 등록을 확인했습니다. 실제 인증은 Unity 빌드 단계에서 확인합니다.")
      - name: Unity로 Windows 게임 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: HumanGhost.Editor.Build.GitHubPlayerBuild.BuildWindows
          versioning: None
          customParameters: -humanGhostScene ${{ inputs.scene }} -humanGhostBuildMode ${{ inputs.build_mode }} -humanGhostVersion 0.1.${{ github.run_number }}
      - name: 실행파일 생성 확인
        shell: python
        run: |
          from pathlib import Path
          if not Path("build/StandaloneWindows64/HumanGhost.exe").is_file():
              raise SystemExit("빌드 결과에 HumanGhost.exe가 없습니다.")
          print("게임 실행파일 생성을 확인했습니다.")
      - name: 타이틀 영상 포함 확인
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re
          prefab = Path("Assets/2.Model/Prefabs/UI/TitleScreen.prefab").read_text(encoding="utf-8")
          match = re.search(r"^  _videoFile: (.+)$", prefab, re.MULTILINE)
          if not match:
              raise SystemExit("타이틀 영상의 파일 상대 경로가 없습니다.")
          relative = match.group(1).strip()
          source_root = Path("Assets/StreamingAssets").resolve()
          source = (source_root / relative).resolve()
          if not source.is_relative_to(source_root) or not source.is_file():
              raise SystemExit("타이틀 영상 원본이 StreamingAssets 내부에 없습니다.")
          output = Path("build/StandaloneWindows64/HumanGhost_Data/StreamingAssets") / relative
          if not output.is_file() or source.stat().st_size == 0:
              raise SystemExit("빌드 결과에 타이틀 영상이 없거나 원본이 비어 있습니다.")
          if hashlib.sha256(source.read_bytes()).digest() != hashlib.sha256(output.read_bytes()).digest():
              raise SystemExit("빌드에 포함된 타이틀 영상이 원본과 다릅니다.")
          print("빌드 결과의 타이틀 영상과 원본 일치를 확인했습니다.")
      - name: 결과물에 빌드 출처 기록
        shell: python
        env:
          BUILD_SOURCE_SHA: ${{ needs.revision.outputs.sha }}
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_SCENE: ${{ inputs.scene }}
        run: |
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["BUILD_SOURCE_SHA"]:
              raise SystemExit("확정한 커밋과 실제 빌드 소스가 다릅니다.")
          source = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          lines = ["인귀 빌드 정보", f"게임 소스 커밋: {sha}",
                   f"워크플로 커밋: {os.environ['GITHUB_SHA']}",
                   f"빌드 종류: {os.environ['BUILD_MODE']}", f"시작 장면: {os.environ['BUILD_SCENE']}",
                   f"실행 번호: {os.environ['GITHUB_RUN_NUMBER']}", f"실행 시도: {os.environ['GITHUB_RUN_ATTEMPT']}",
                   f"기록 시각 UTC: {datetime.now(timezone.utc).isoformat()}",
                   f"소스: {source}/commit/{sha}", f"실행 기록: {source}/actions/runs/{os.environ['GITHUB_RUN_ID']}"]
          Path("build/StandaloneWindows64/빌드 정보.txt").write_text("\n".join(lines) + "\n", encoding="utf-8-sig")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"## 빌드 출처\n- 실제 게임 소스: `{sha}`\n- 결과물에 빌드 정보.txt를 포함했습니다.\n")
      - name: 게임 파일 보관
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumanGhost-Windows-${{ inputs.build_mode }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ needs.revision.outputs.short-sha }}
          path: build/StandaloneWindows64/
          if-no-files-found: error
          retention-days: 7

  notify:
    name: 빌드 전용 채널 공지
    needs: [revision, checks, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 공지 코드 받기
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 빌드 결과 전송
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          NOTICE_OPERATION: ${{ inputs.operation }}
          BUILD_SCENE: ${{ inputs.scene }}
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_SOURCE_SHA: ${{ needs.revision.outputs.sha }}
          REVISION_RESULT: ${{ needs.revision.result }}
          CHECK_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_ARTIFACT_URL: ${{ needs.build.outputs.artifact-url }}
        run: python -B Tools/Automation/discord_notice.py build
