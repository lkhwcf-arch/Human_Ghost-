name: 디스코드 머지 알림

on:
  push:
    branches: [Develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: 디스코드 공지 전송
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 공지 코드 받기
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 개발 채널 공지 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -B Tools/Automation/discord_notice.py merge
