name: 프로젝트 자동 검사

on:
  push:
    branches: [Develop]
  pull_request:
    branches: [Develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: '검사할 실제 게임 소스 커밋. 생략하면 실행 커밋'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  telemetry:
    name: 통계 집계·엑셀·Firestore 접근 규칙 검사
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 검사 대상 코드 받기
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: 통계 조회 실행 환경 준비
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Tools/TelemetryConsole/package-lock.json
      - name: 공식 에뮬레이터 실행 환경 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 조회 도구 의존성 복원
        working-directory: Tools/TelemetryConsole
        run: npm ci --no-audit --no-fund
      - name: 통계 집계와 엑셀 검사
        working-directory: Tools/TelemetryConsole
        run: npm test
      - name: 정책·규칙 생성과 조회 화면 빌드
        working-directory: Tools/TelemetryConsole
        run: npm run build
      - name: 운영과 분리된 Firestore 규칙 검사
        working-directory: Tools/TelemetryConsole
        run: npm run firebase -- emulators:exec --only firestore --project demo-humanghost "node --test tests/rules.emulator.mjs"
  checks:
    name: 데이터·게임 코어·빌드 공지 검사
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 검사 대상 코드 받기
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: 검사 실행 환경 준비
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 통합 검사 실행
        shell: pwsh
        run: ./Tools/Verify-Project.ps1
      - name: 빌드 공지 구성 검사
        shell: pwsh
        run: python -B -m unittest discover -s Tools/Automation -p "test_*.py"
      - name: PNG 무손실 압축 계약 검사
        shell: pwsh
        run: python -B Tools/Resources/test_optimize_png.py
      - name: 검사 결과 요약
        if: always()
        shell: pwsh
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          $statusText = switch ($env:CHECK_STATUS) {
              'success' { '성공' }
              'cancelled' { '취소' }
              default { '실패' }
          }
          @"
          ## 프로젝트 자동 검사
          - 실행 결과: $statusText
          - 검사 대상 커밋: $(git rev-parse HEAD)
          - 범위: 배포된 데이터 읽기·변환·초기화·오류 분리, 순수 게임 코어와 빌드 공지 구성
          - 실제 Unity 플레이·플레이어 빌드는 포함하지 않습니다.
          - 실패한 단계의 실행 기록에서 원인을 확인해주세요.
          "@ >> $env:GITHUB_STEP_SUMMARY
